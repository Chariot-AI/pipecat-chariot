[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-chariot"
version = "0.1.2"
description = "Chariot text-to-speech for Pipecat"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Chariot AI" }]
keywords = ["pipecat", "chariot", "tts", "text-to-speech", "voice", "indian-languages"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "pipecat-ai>=1.7,<2",
    "websockets>=13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://chariot.in"
Documentation = "https://docs.chariot.in/api-reference/introduction"
Repository = "https://github.com/Chariot-AI/pipecat-chariot"
Changelog = "https://github.com/Chariot-AI/pipecat-chariot/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_chariot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
